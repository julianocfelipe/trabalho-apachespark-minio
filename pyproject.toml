[project]
name = "trabalho-apachespark-minio"
version = "0.1.0"
description = "Apache Spark com Delta Lake e MinIO — Engenharia de Dados SATC 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "delta-spark==3.2.0",
    "pyspark==3.5.3",
    "pyodbc>=5.0.0",
    "pandas>=2.0.0",
    "boto3>=1.34.0",
    "jupyterlab>=4.5.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[tool.taskipy.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
docs-deploy = "mkdocs gh-deploy"
